; ===== THE OPENING STORY SCREEN (scenes/intro.tscn). The heading uses [b] bold and [color=...] tags.
[intro]

; The heading line.
heading = "[b]OCTOBER [color=#ffffff]1964[/color].  A STORMY NIGHT.[/b]"
; The story. \n\n starts a new paragraph.
body = "Despite rough weather, your pillow is too warm, your mind like Seabiscuit. Aggressive red digits at your bedside table glow: 2:04 AM.\n\nSleep is unappealing. You know you shouldn't be doing this, but like the scorpion, you can't be anything else. You get up, get dressed, and step outside, wielding your umbrella for approximately 1.4 seconds before it catches enough wind to invert. Useless. You toss it back inside, tighten your hood, and go.\n\nBack at the lab, you recall sleepless nights spent trying to inject the spark of life into your colourful creations: \"bups\", as you call them — a portmanteau of \"bacterial pups\". They aren't bacteria, of course. They aren't anything yet. But just as you start to ponder which of the four prepared nutrient slurries has developed enough, you hear a CRACK, then your vision is white. Then nothing.\n\nYou are confused, on the floor. Something happened, but you're not sure what. Then you remember the flash, the crack — it must have been a lightning strike. Propped up on your elbows, you lift your head to see grey dust on the side of the lab bench. You reach a hand out to touch it. Pulling your hand back, you see your finger is covered in powder. As you stand up, you see the mess that your lab top, and your last experiment, have beecome. Bups, floating in water, decorated with soot and shattered glass. But...\n\nIT'S ALIVE!\n\nThe lightning must have done it. That was the missing piece!\n\nFour tiny dots. Only now, instead of drifting lazily, they're mobile, self-driven, hungry, searching.\n\nYou don't know when this opportunity will happen again. Abiogenesis!\n\nI's time to buckle up — these creatures need your help. Death comes for us all, but with any luck, and a little technique, not yet for these bups."
; The hint at the end of the story.
prompt = "SPACE or ENTER to begin"
; The line of keys at the bottom of the screen while the story is told.
hint = "SPACE  show it all      ESC  skip"
; The button at the bottom right that skips the story.
skip = "Skip story"

