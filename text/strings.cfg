; Every word the player reads. Edit the text between the quotes.
;
; - A line is  name = "text"  under a [section]. Lines starting with ; are notes.
; - \n starts a new line, \" is a quote mark.
; - %d, %s, %.0f, %.1f are places where the game puts a number or a word. Keep the same ones, in the same order, as in the original,
;   or the game will complain. %% is a percent sign.
; - The scenes refer to a text as @section.name, the code as Strings.t("section.name").

