; ===== THE ENCYCLOPEDIA (scripts/encyclopedia.gd, ui/encyclopedia_panel.gd). It explains the game's terms and concepts. Each entry has two parts, kept apart:
; `<id>_about` is what the thing is in real life (biology, checked against sources) and `<id>_game` is how it works in the game (values, ranges, costs, and where the game departs from real life).
; Either may be missing. How to do things (what to click, what a control does) is never in an entry: that is the tutorial's ([tutorial]) and the tooltips'.
; An entry links to another with [url=id]words[/url].
[encyclopedia]

; Name of the encyclopedia screen.
heading = "Encyclopedia"
; Hint in the search box.
search = "Search"
; Shown in place of the list when nothing matches the search.
none_found = "Nothing matches."
; Heading over the part of an entry that says how the thing works in the game.
heading_game = "In the game"
; Heading over the part of an entry that says what the thing is in real life.
heading_about = "In real life"
; Heading in the list: the genome.
cat_genome = "The genome"
; Heading in the list: how bups change.
cat_evolution = "Evolution"
; Heading in the list: what a bup is and does.
cat_bups = "Bups"
; Heading in the list: what is in the dish.
cat_dish = "The dish"

; Entry title.
chromosome_title = "Chromosome"
; Entry, real life: Chromosome.
chromosome_about = "A bacterium usually has a single chromosome with one copy of each [url=allele]gene[/url], which makes it haploid (you have two copies of each). A real E. coli has about 4,000 genes."
; Entry, in the game: Chromosome.
chromosome_game = "A bup has one chromosome too, but only a handful of genes, and each stands for a whole group of real ones: [url=speed]speed[/url], [url=sense]sense[/url], [url=metabolism]metabolism[/url], [url=size]size[/url], the [url=mutator]mutator[/url], the [url=donor]F factor[/url] and the [url=key]acetate key[/url]. They always lie in the same order. The [url=founders]founders[/url] start with the usual allele of each.\n\nThe genome map of a bup draws each gene as a band of its own colour with its three-letter symbol; the shade of the band is the allele, dim for a low value and bright for a high one, and the number beside it is the value. +1, +2 or +3 says the gene's ceiling has been raised (see [url=ceilings]raised ceilings[/url]). A band with nothing in it means the bup does not have the F factor or the acetate key."

; Entry title.
allele_title = "Gene, locus and allele"
; Entry, real life: Gene, locus and allele.
allele_about = "A gene is a stretch of DNA that does one job, and its place on the chromosome is its locus. An allele is one version of a gene. In real bacteria alleles differ in their DNA letters."
; Entry, in the game: Gene, locus and allele.
allele_game = "Every allele is a number, such as a [url=speed]speed[/url] of 20 or of 31. A bup has one allele of each gene, and its daughters have the same one unless a [url=mutation]mutation[/url] changes it."

; Entry title.
speed_title = "Speed"
; Entry, real life: Speed.
speed_about = "A real E. coli swims at about 20 micrometres a second, driven by flagella that many genes build and control. Swimming costs a cell energy."
; Entry, in the game: Speed.
speed_game = "The gene is the swimming speed. The [url=founders]founders[/url] start at 20 and the gene ranges from 5 to 40; a [url=ceilings]raised ceiling[/url] can take it further. A faster bup reaches food sooner, but the faster it swims the more it pays just to stay alive."

; Entry title.
sense_title = "Sense"
; Entry, real life: Sense.
sense_about = "A real E. coli cannot see food from a distance, and it is too small to feel a slope across its own body. Instead it compares the concentration of food now with a few seconds ago while it swims in a straight run, and it turns (tumbles) at random less often when things are getting better. This is called chemotaxis."
; Entry, in the game: Sense.
sense_game = "The sense gene is how accurately a bup measures that change. With a low sense its readings are noisy, so it often turns the wrong way and drifts almost at random; with a high sense it climbs a slope toward food reliably (see [url=steering]steering[/url]). The founders start at 50 and the gene ranges from 10 to 150. Sensing costs a little energy."

; Entry title.
metabolism_title = "Metabolism"
; Entry, real life: Metabolism.
metabolism_about = "Cells face a trade-off between how fast they grow and how efficiently they use food: a quick, wasteful way of living against a slow, thrifty one. It is set by thousands of genes."
; Entry, in the game: Metabolism.
metabolism_game = "One gene stands for the whole balance. A higher metabolism takes food in and grows faster, but gets less out of each bit of it (its yield falls with the square root of the metabolism). The founders start at 1.0 and the gene ranges from 0.4 to 2.0. When a dish is set to let bups starve, the fast ones die first."

; Entry title.
size_title = "Size"
; Entry, real life: Size.
size_about = "How big a cell grows before it divides depends on its genes and on how fast it grows. Real E. coli have grown larger over thousands of generations in the long-term evolution experiment."
; Entry, in the game: Size.
size_game = "The gene sets how much [url=mass]mass[/url] a bup adds between its birth and its division: half the gene squared. A bup is a quarter of a micrometre long for each unit of mass, so a line that has settled divides at a length of about the gene squared over four: 1 µm at a gene of 2, 4 µm at the founders' 4, 16 µm at 8. The gene ranges from 2 to 8, and a raised [url=ceilings]ceiling[/url] lifts its top. A bigger bup takes in more food, and has more body to keep alive."

; Entry title.
mutator_title = "Mutator"
; Entry, real life: Mutator.
mutator_about = "A real mutator is a cell that has lost one of its DNA-repair genes, such as mutS, mutL, mutT or mutY, and so makes many more copying errors: roughly ten to a few hundred times as many, depending on the gene. A mutT line in the long-term experiment made about 150 times as many point mutations, and later mutY mutations cut that rate by 40 to 60%. A mutator has no advantage of its own; it spreads only by riding along with the helpful mutations it makes in the same chromosome (hitchhiking)."
; Entry, in the game: Mutator.
mutator_game = "The gene is how many times the usual rate a bup makes [url=mutation]mutations[/url] in its daughters; 1 is the usual rate. It has four alleles: normal, about 10 times, about 100 times and about 150 times. A later change can halve it again. A mutator pays for its rate with more [url=harm]harm[/url]."

; Entry title.
donor_title = "F factor (donor)"
; Entry, real life: F factor (donor).
donor_about = "The F factor (F for fertility) is a plasmid, a ring of DNA about 100,000 letters long, that lets a bacterium act as a donor in [url=conjugation]conjugation[/url]: it carries the genes for the pilus and for the machinery that passes DNA across. A cell with a free F factor mostly passes on the F factor itself. Sometimes the F factor becomes built into the chromosome, and the cell is then called Hfr, for high frequency of recombination, because it passes chromosomal genes too, starting next to the F factor."
; Entry, in the game: F factor (donor).
donor_game = "A bup either has the F factor or not, and it is then a donor. Every donor in the game is of the Hfr kind. Carrying it costs about 9% of a bup's growth (the average cost measured for plasmids), and a daughter may rarely gain or lose it."

; Entry title.
conjugation_title = "Conjugation"
; Entry, real life: Conjugation.
conjugation_about = "Bacteria do not mate, and are not male or female, but a cell can pass DNA sideways to one it is not descended from. A donor (see [url=donor]F factor[/url]) reaches out to a cell without the F factor with a thin tube, the pilus, and one strand of DNA is fed across, starting at a fixed point beside the F factor. The receiver builds the missing strand and can swap the new genes in for its own versions (homologous recombination). The cells usually drift apart before the end, so the genes nearest the start are passed most often; the whole chromosome would take about 100 minutes."
; Entry, in the game: Conjugation.
conjugation_game = "A donor that touches a bup without the F factor passes on its speed gene, and then goes on to the next gene (sense, metabolism, size) each time with even odds. The receiver keeps the new alleles and passes them on, so a good allele can jump between lines that are not related. Real transfers take minutes; here they are faster, so that a short touch is enough."

; Entry title.
key_title = "Acetate key"
; Entry, real life: Acetate key.
key_about = "Real E. coli that feed on acetate have evolved changes to the acs gene that let them take it up faster. In the long-term evolution experiment one population learned to feed on citrate, but only after earlier changes had made that possible."
; Entry, in the game: Acetate key.
key_game = "A rare change in two steps that lets a line live on [url=acetate]acetate[/url] much better: it takes acetate up about 2.2 times faster, nearly as fast as glucose. The first step, primed, does nothing you could see, and only a primed line can take the second, the key, which costs about 3% of growth."

; Entry title.
ceilings_title = "Raised ceilings"
; Entry, real life: Raised ceilings.
ceilings_about = "Real populations do not stop improving at a fixed limit: in the long-term experiment cells kept growing faster and larger for tens of thousands of generations, with smaller gains each time."
; Entry, in the game: Raised ceilings.
ceilings_game = "Each gene has a usual range. Rarely a [url=mutation]mutation[/url] raises the top of a gene's range for one line, up to three times, by a smaller step each time (about a quarter the first time). Each raise costs about 5% of the bup's growth."

; Entry title.
mutation_title = "Mutation"
; Entry, real life: Mutation.
mutation_about = "A mutation is a change in DNA, usually an error made when the DNA is copied. Mutations are random: they do not appear because a cell needs them."
; Entry, in the game: Mutation.
mutation_game = "A bup's daughters can differ from it, and each division brings, at the usual mutation rate, about 0.4 random changes on average, so two divisions in three bring none (a [url=mutator]mutator[/url] multiplies that): a change to a gene (helpful or harmful, depending on the dish), damage elsewhere in the genome that adds to the bup's [url=harm]harm[/url] (about one in twenty of these kills the daughter at once), and very rarely the repair of earlier damage. Every mutation also nudges the bup's colour a little, so relatives stay alike in colour; colour has no effect on how well a bup does. The rate is raised to roughly 130 to 400 times a real E. coli's (Drake estimated about 0.003 mutations per genome per division; whole-genome sequencing of lab lines since finds about 0.001) so that evolution shows within a game; the kinds of change are realistic."

; Entry title.
harm_title = "Harm"
; Entry, real life: Harm.
harm_about = "A population that does not shuffle its genes can lose its least damaged line by chance, and with it the way back from the damage: Muller's ratchet. It is strongest in small populations, and harmful mutations can then pile up for good."
; Entry, in the game: Harm.
harm_game = "Harm is the damage a line has built up from harmful [url=mutation]mutations[/url], shown as the share of food yield it costs: 10% means 10% less growth from the same food. It goes down only by a rare repairing mutation."

; Entry title.
selection_title = "Natural selection"
; Entry, real life: Natural selection.
selection_about = "Cells that grow and divide faster leave more descendants, so their alleles become commoner, and cells that die by chance leave fewer. No individual changes to suit its surroundings: the differences are already there, from [url=mutation]mutation[/url], and selection sorts them."
; Entry, in the game: Natural selection.
selection_game = "What helps depends on the dish. Where food is thin, [url=sense]sensing[/url] and [url=speed]speed[/url] pay; where it is plentiful, a quick [url=metabolism]metabolism[/url] often does, as it does in real cultures that favour fast, wasteful growth. Nothing in the game picks the winners."

; Entry title.
generation_title = "Generation"
; Entry, real life: Generation.
generation_about = "The long-term E. coli experiment counts generations as divisions."
; Entry, in the game: Generation.
generation_game = "A dish's generation is the average number of divisions in its bups' family lines. A bup's own count is the divisions in its line, including the one that made it."

; Entry title.
founders_title = "Founders"
; Entry, in the game: Founders.
founders_game = "The bups a dish starts with. They normally have the usual alleles (speed 20, sense 50, metabolism 1.0, size 4.0, no [url=mutator]mutator[/url], no [url=donor]F factor[/url])."

; Entry title.
mass_title = "Mass"
; Entry, real life: Mass.
mass_about = "A rod-shaped bacterium such as E. coli grows longer exponentially, so its growth speeds up as it lengthens, and divides after adding a roughly fixed amount of size since it was born, whatever size it was born at (the adder rule, found by following single cells). Its mass goes with its length."
; Entry, in the game: Mass.
mass_game = "A bup's mass is drawn as a length: the bar is its body, so a longer fill is a heavier bup. The white tick is the mass it was born with, and at the end of the bar it divides, which takes its birth mass plus an amount set by its [url=size]size[/url] gene. It then splits in two, each product keeping about half of the mass and of the [url=energy]reserve[/url] (between 35% and 65%), so the bar drops back to near the tick. With starvation on, a bup without food digests its own body and its mass falls below the tick; at a quarter of its birth mass it dies (the red tick)."

; Entry title.
energy_title = "Reserve (energy)"
; Entry, real life: Reserve.
energy_about = "Cells keep energy-rich compounds in store, such as glycogen in E. coli, to carry them through when food runs short."
; Entry, in the game: Reserve.
energy_game = "The energy a bup holds, shown against the most its body can hold (8 for each unit of [url=mass]mass[/url]). Staying alive, swimming and sensing cost it energy all the time, and growth can spend only what is above a floor of 5, which is the tick on the bar. While the reserve sits at the floor and the bup is still growing, all its food goes straight into growth: it is food-limited (amber). Above the floor it has a surplus (green). When it is starving (red), its mass has shrunk below its birth mass with starvation on, or its reserve is far below the floor without it. A full reserve means food is coming in faster than the bup can use it."

; Entry title.
steering_title = "Steering"
; Entry, in the game: Steering.
steering_game = "How reliably a bup is drifting up a nutrient slope where it is: blind, faint, clear or sure. It depends on the bup's [url=sense]sense[/url] and [url=speed]speed[/url] and on how steep the slope is."

; Entry title.
starvation_title = "Starvation"
; Entry, real life: Starvation.
starvation_about = "A starved E. coli culture first stops growing, and its cells shrink. The cells then die at a roughly constant rate, with the survivors living partly on what the dead cells leave. Cells that were growing faster before the food ran out die sooner (Schink et al. 2019; Biselli, Schink and Gerland 2020)."
; Entry, in the game: Starvation.
starvation_game = "Dishes start with this option off, and goal mode never has it. Without it a bup dies when its [url=energy]reserve[/url] is empty. With it, a bup whose reserve is at the floor stops growing and pays a small upkeep of 8% of its body's energy a day, from the reserve and then from its mass, so it shrinks. It dies by chance at a constant rate that grows with its [url=metabolism]metabolism[/url] gene: 0.33 a day at 0.4, 0.59 a day at the founders' 1.0, 1.6 a day at 2.0, or when it has shrunk to a quarter of its birth mass. A bup that finds food grows again. A starved bup gives back a quarter of its body as [url=nutrient]nutrient[/url]."

; Entry title.
population_cap_title = "Population cap"
; Entry, real life: Population cap.
population_cap_about = "A real culture stops growing when food or room runs out, and experiments often cut it back at random: the long-term evolution experiment dilutes its flasks a hundredfold each day, and which cells are kept is chance, not fitness. The Moran process, a standard model of a population of fixed size, has one individual reproduce and another, chosen at random, die."
; Entry, in the game: Population cap.
population_cap_game = "A dish holds at most the cap (100,000 bups in goal mode; free mode sets it). Past it, each new bup takes the place of a bup picked at random from those already there, so fitter lines still spread by dividing more, while the population holds steady. The bup that is displaced gives back no [url=nutrient]nutrient[/url]. The cap is a game limit: a real dish has no such number."

; Entry title.
nutrient_title = "Nutrient"
; Entry, real life: Nutrient.
nutrient_about = "E. coli grows on sugars such as glucose. The contents of dead cells feed the living too: in starved cultures the survivors recover about a tenth to a fifth of what a dead cell held."
; Entry, in the game: Nutrient.
nutrient_game = "The food in the game is glucose. It spreads out slowly through the medium, which the game makes thicker than water so that clouds of food last long enough to climb. Nutrient comes as doses, from [url=sources]sources[/url], as a steady feed, or as [url=plankton]plankton[/url]. A bup that dies, of [url=starvation]starvation[/url] or by chance, gives back a quarter of its body (its mass, not its reserve) as nutrient where it died; a bup removed to hold the [url=population_cap]population cap[/url], or erased, gives back nothing."

; Entry title.
acetate_title = "Acetate"
; Entry, real life: Acetate.
acetate_about = "E. coli that grow fast on glucose let go of acetate as a by-product, and it can feed other cells."
; Entry, in the game: Acetate.
acetate_game = "A bup that takes in more than it can use lets go of acetate, and a bup with room in its reserve takes it up, more slowly than glucose and less while there is glucose. It is why a line may evolve the [url=key]acetate key[/url]."

; Entry title.
sources_title = "Nutrient sources"
; Entry, in the game: Nutrient sources.
sources_game = "A source leaks [url=nutrient]nutrient[/url] at a steady rate that you set. It makes a slope in the dish for bups to climb."

; Entry title.
plankton_title = "Plankton"
; Entry, in the game: Plankton.
plankton_game = "A plankton floats in the dish and, some time after it appears, bursts into a cloud of [url=nutrient]nutrient[/url]. The plankton bloom setting says how many appear for each square millimetre each day. With plankton husks on, a dead plankton leaves a [url=husks]husk[/url] instead."

; Entry title.
husks_title = "Husks"
; Entry, real life: Husks.
husks_about = "A dead cell spills its contents, and the cells around it can feed on them."
; Entry, in the game: Husks.
husks_game = "With bup husks on, a dead bup leaves a husk, a small dot in the dish, and its [url=nutrient]nutrient[/url] comes back in twelve lumps, the first after 22 minutes and then one every 45 minutes: about a fifth of it in the first hour, half by the second, nearly two thirds by the third, and the last of it after about eight and a half hours. Without husks all of it comes back at once, as a cloud where the bup died. Plankton husks are the same for dead plankton."
