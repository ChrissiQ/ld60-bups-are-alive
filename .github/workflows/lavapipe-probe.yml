# Probe: does Godot RenderingDevice compute run on ubuntu-latest with the software Vulkan
# driver (lavapipe) under a virtual display? It dispatches one trivial kernel (tools/ci/compute_probe.gd)
# and fails unless the job prints COMPUTE_PROBE OK. Runs on pushes to branches, never on v* tags.
name: lavapipe-probe
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  workflow_dispatch:
env:
  GODOT_VERSION: "4.7.2"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install lavapipe, xvfb and the Vulkan loader
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools xvfb unzip
      - name: Get Godot
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Show the Vulkan device
        run: |
          ls /usr/share/vulkan/icd.d/
          echo "VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)" vulkaninfo --summary || true
      - name: Dispatch the probe under xvfb
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path tools/ci/probe_project --rendering-driver vulkan -s ../compute_probe.gd --quit-after 600 2>&1 | tee probe.log
          grep -q "^COMPUTE_PROBE OK$" probe.log || { echo "::error::The probe did not print COMPUTE_PROBE OK"; exit 1; }
